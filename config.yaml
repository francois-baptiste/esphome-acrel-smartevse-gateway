esphome:
  name: passerelle-energie-waveshare

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf  # Essentiel pour la stabilité de l'UART/Modbus sur l'ESP32-S3
    # Épinglé (au lieu du "recommended" 5.5.4) : le mécanisme de "response
    # files" du toolchain CMake de 5.5.4 génère des fichiers
    # cflags/cxxflags/asmflags/ldflags vides plutôt que peuplés (bug
    # d'amorçage CMake/IDF), provoquant des "dangerous relocation: call8"
    # au link faute des flags d'architecture (-mlongcalls etc.).
    # 5.3.5 s'est avéré trop ancien (wifi_scan_config_t.coex_background_scan
    # manquant, requis par le composant wifi de cette version d'ESPHome).
    # 5.4.4 = compromis : assez récent pour l'API wifi, sans le bug 5.5.x.
    version: "5.4.4"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

web_server:
  port: 80

# =====================================================================
# CLIENT MQTT POUR LE SMARTEVSE (remplace les POST HTTP /currents et /ev_meter)
# =====================================================================
# SmartEVSE (fork basmeerman) est déjà connecté à ce broker (cf. /settings ->
# mqtt.host) et son firmware sait consommer les topics Set/MainsMeter et
# Set/EVMeter (mqtt_parser.c). Le publish MQTT (petit payload, pas de
# handshake TCP+HTTP par cycle) est bien plus léger que le POST HTTP toutes
# les 3s, surtout ce broker étant sur Internet (pas sur le LAN local).
# topic_prefix "SmartEVSE/8931" = celui vu dans /settings au moment du
# déploiement ; à corriger si l'utilisateur change ce réglage côté SmartEVSE.
mqtt:
  id: smartevse_mqtt
  broker: "37.187.129.84"
  port: 1883
  discovery: false # on ne veut pas que ce client MQTT auto-publie/-découvre nos capteurs Acrel/Linky

globals:
  - id: smartevse_mains_da
    type: int
    initial_value: '0'

  - id: smartevse_ev_da
    type: int
    initial_value: '0'

  - id: smartevse_ev_power_w
    type: int
    initial_value: '0'

  - id: smartevse_ev_energy_wh
    type: int
    initial_value: '0'

  - id: smartevse_linky_is_hp
    type: int
    initial_value: '0'

  - id: smartevse_linky_is_hc
    type: int
    initial_value: '0'

  # --- Etat de la boucle DLB ETEK (cf. section 6) ---
  - id: etek_dlb_last_current_a
    type: int
    initial_value: '-1' # dernier courant (A) réellement écrit en registre 109 ; -1 = jamais écrit

  - id: etek_dlb_enabled
    type: int
    initial_value: '-1' # dernière valeur connue du registre 89 (0=actif, 2=pause) ; -1 = inconnu, force une écriture au 1er cycle

  - id: etek_dlb_pending_target_a
    type: int
    initial_value: '0' # cible en hausse en attente de confirmation (anti-oscillation, cf. section 6)

  - id: etek_dlb_pending_count
    type: int
    initial_value: '0'

# =====================================================================
# 1. DECLARATION DES DEUX PORTS SERIE (UART) WAVESHARE
# =====================================================================
uart:
  # Port A : Pour le RS485 de l'Acrel (Bornier Vert)
  - id: modbus_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    # tx_enable_pin retiré d'ici ! (piloté par modbus: flow_control_pin)
    # 9600 : l'ETEK EKEPC2-C ne répond en réalité qu'à 9600 (confirmé par test
    # direct PC/USB-RS485), malgré le manuel constructeur qui annonce 38400,n,8,1
    # fixe. L'Acrel a été reconfiguré en conséquence pour rester sur le même bus.
    baud_rate: 9600
    data_bits: 8
    # L'ADL400 Acrel sort d'usine en 8N1 (parité NONE). EVEN empêchait
    # toute réponse du compteur (trames rejetées côté esclave).
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256

  # Port B : Pour la Téléinfo (Connecteur SH1.0)
  - id: teleinfo_uart
    # GPIO2 = pin data documentée par le wiki Waveshare pour le connecteur
    # SH1.0 (GND/3V3/GPIO2/GPIO1). GPIO1, GPIO11 et GPIO12 testés en
    # diagnostic sans succès (0 octet reçu sur les 4) : le problème n'est
    # plus une histoire de mapping de pin, cf. investigation matérielle.
    rx_pin: GPIO2
    baud_rate: 9600
    # La trame TIC (Historique ET Standard) est toujours 7E1 (7 bits + parité
    # paire), seul le débit change entre les deux modes (1200 vs 9600 bauds).
    # 8N1 laissait le composant teleinfo lever "Invalid number of data bits"
    # / "Invalid parity" au boot et aucune trame n'était décodée (bit de parité
    # mal interprété comme 8e bit de données -> désynchronisation de trame).
    data_bits: 7
    parity: EVEN
    stop_bits: 1

# =====================================================================
# 2. CONFIGURATION DES PROTOCOLES
# =====================================================================
modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: GPIO21  # Pilote le sens RS485 (EN sur le schéma Waveshare)
  # Défaut ESPHome = 600ms de silence forcé après CHAQUE commande, indépendant du baud rate.
  # C'est le vrai goulot d'étranglement du cycle de lecture (~8 groupes de registres/cycle).
  # Réduit à 100ms ; si des erreurs/timeouts Modbus apparaissent dans les logs, remonter la valeur.
  turnaround_time: 100ms

modbus_controller:
  - id: acrel_adl400
    address: 0x0B
    modbus_id: modbus_bus
    # Défaut ESPHome = 60s. Remonté à 2s pour des données plus fraîches ; le bus est
    # maintenant à 9600 (au lieu de 38400) pour rester compatible avec l'ETEK, donc
    # chaque octet prend 4x plus de temps qu'avant -> si des timeouts/"Duplicate
    # modbus command" apparaissent dans les logs, redescendre cette valeur.
    update_interval: 2s

  # ETEK EKEPC2-C : adresse Modbus fixée à 100 (0x64) via écriture registre 100
  # ("Device address number") depuis un adaptateur USB-RS485 externe, en remplacement
  # de l'adresse de diffusion 255 sortie d'usine. Bus confirmé fonctionnel à 9600,n,8,1.
  - id: etek_epc2
    address: 0x64
    modbus_id: modbus_bus
    update_interval: 2s

# Cibles d'écriture Modbus pour le plafonnement de courant ETEK (boucle DLB, section 6).
# Registre 109 ("Maximum output PWM duty cycle of charging pile", lecture/écriture) :
# facteur d'échelle = ampères * 167 (source : evcc-io/evcc#18550). CONFIRMÉ sur ce
# firmware le 2026-10-08 : cible loggée 16A (brut 2672) vs courant réellement mesuré
# côté Acrel L2 (indépendant de l'ETEK) = 15.85-15.92A, écart <1%, cohérent avec le
# bruit de mesure normal. Ne pas recalibrer sans raison.
# ATTENTION : registre 146 ("ETEK EPC2 Courant de charge", cf. section sensor ci-dessous)
# et les registres voisins 148/149 (tension/puissance) sont eux NON FIABLES sur ce
# firmware -> ils affichent ~0 pendant que l'Acrel L2 mesure ~16A/234V/~3.7kW réels au
# même instant. Ne pas s'y fier pour du diagnostic ou pour une future boucle de
# feedback ; la boucle DLB n'en dépend pas (elle utilise Acrel + Linky), donc ce bug
# ne l'affecte pas, mais les sensors eux-mêmes affichent des valeurs fausses dans l'UI.
# Registre 89 : écrit par la boucle DLB pour mettre en pause (2) ou réactiver (0) la
# charge quand le courant disponible tombe sous le plancher IEC 61851 (6A) ; même
# source evcc-io/evcc#18550, non vérifié indépendamment (nécessiterait de provoquer
# un vrai dépassement de PREF), mais cohérent avec le comportement observé.
# Ces deux entités "number" restent exposées (Web UI/API) pour override manuel/debug ;
# la valeur brute (pas l'ampérage) est ce qui est stocké/affiché, volontairement sans
# filtre "multiply" pour ne pas masquer la valeur réellement écrite sur le bus.
number:
  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Registre 109 (courant max, brut = A x 167)"
    id: etek_epc2_reg109
    register_type: holding
    address: 109
    value_type: U_WORD
    min_value: 0
    max_value: 6000
    step: 1
    mode: box

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Registre 89 (activation : 0=actif, 2=pause)"
    id: etek_epc2_reg89
    register_type: holding
    address: 89
    value_type: U_WORD
    min_value: 0
    max_value: 2
    step: 2
    mode: box

teleinfo:
  id: linky_tic
  uart_id: teleinfo_uart
  historical_mode: false # Linky en mode Standard

# =====================================================================
# 3. CAPTEURS (Acrel et Linky)
# =====================================================================

sensor:
  # --- ETEK EKEPC2-C (registres documentés Usage-Manual-for-EKEPC2-C-S.pdf p.26-27) ---

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Statut"
    id: etek_epc2_status
    register_type: holding
    address: 141 # "Current working status", codes 0-13 (cf. table LED p.14 pour la correspondance)
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Courant de charge"
    id: etek_epc2_current
    register_type: holding
    address: 146 # "Current value of charging pile 0-200.0A"
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Tension"
    id: etek_epc2_voltage
    register_type: holding
    address: 148 # "Current voltage value of charging pile 0-500.0V"
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Puissance"
    id: etek_epc2_power
    register_type: holding
    address: 149 # "Current power value of charging pile 0-22000W"
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  # --- COURANTS ACREL (Pour le calcul Monophasé) ---

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Courant L1 (Rangée 1)"
    id: acrel_current_l1
    register_type: holding
    address: 0x0064 # Confirmé datasheet ADL400 : résolution 0.01A
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "A"

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Courant L2 (Voiture EV)"
    id: acrel_current_l2
    register_type: holding
    address: 0x0065
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "A"

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Courant L3 (Rangée 2)"
    id: acrel_current_l3
    register_type: holding
    address: 0x0066
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "A"

  # --- TENSIONS ACREL ---

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Tension L1"
    id: acrel_voltage_l1
    register_type: holding
    address: 0x0061 # Résolution 0.1V (manuel ADL400 §9.1)
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Tension L2"
    id: acrel_voltage_l2
    register_type: holding
    address: 0x0062
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Tension L3"
    id: acrel_voltage_l3
    register_type: holding
    address: 0x0063
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Fréquence"
    id: acrel_frequency
    register_type: holding
    address: 0x0077 # Résolution 0.01Hz
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "Hz"
    device_class: frequency

  # --- PUISSANCES ACREL ---
  # Registres 32 bits (2 mots). Si les valeurs lues sont aberrantes,
  # remplacer S_DWORD/U_DWORD par S_DWORD_R/U_DWORD_R (ordre des mots inversé).
  #
  # CONSOLIDATION LECTURES MODBUS : ESPHome ne fusionne des capteurs en une seule
  # requête que si leurs adresses sont STRICTEMENT contiguës (pas de "max gap"
  # configurable). Le bloc 0x0164-0x017F est un span continu de 28 registres dans
  # le datasheet (puissances actives/réactives/apparentes + cosphi, par phase et
  # total) : en ajoutant les capteurs par-phase qui manquaient (réactif/apparent/PF
  # A/B/C), ce bloc entier passe de 4 requêtes Modbus séparées à 1 seule, sans
  # rien sacrifier (les données par-phase sont utiles en plus). Gain estimé :
  # ~3 x turnaround_time (~300ms) par cycle de lecture.

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active L1"
    id: acrel_active_power_l1
    register_type: holding
    address: 0x0164 # Résolution 0.001kW
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active L2"
    id: acrel_active_power_l2
    register_type: holding
    address: 0x0166
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active L3"
    id: acrel_active_power_l3
    register_type: holding
    address: 0x0168
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active Totale"
    id: acrel_active_power_total
    register_type: holding
    address: 0x016A
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive L1"
    id: acrel_reactive_power_l1
    register_type: holding
    address: 0x016C # Résolution 0.001kvar
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive L2"
    id: acrel_reactive_power_l2
    register_type: holding
    address: 0x016E
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive L3"
    id: acrel_reactive_power_l3
    register_type: holding
    address: 0x0170
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive Totale"
    id: acrel_reactive_power_total
    register_type: holding
    address: 0x0172 # Résolution 0.001kvar
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente L1"
    id: acrel_apparent_power_l1
    register_type: holding
    address: 0x0174 # Résolution 0.001kVA
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente L2"
    id: acrel_apparent_power_l2
    register_type: holding
    address: 0x0176
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente L3"
    id: acrel_apparent_power_l3
    register_type: holding
    address: 0x0178
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente Totale"
    id: acrel_apparent_power_total
    register_type: holding
    address: 0x017A # Résolution 0.001kVA
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance L1"
    id: acrel_power_factor_l1
    register_type: holding
    address: 0x017C # Résolution 0.001
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance L2"
    id: acrel_power_factor_l2
    register_type: holding
    address: 0x017D
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance L3"
    id: acrel_power_factor_l3
    register_type: holding
    address: 0x017E
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance Totale"
    id: acrel_power_factor_total
    register_type: holding
    address: 0x017F # Résolution 0.001
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  # --- ENERGIE ACTIVE ACREL (Import/Export, compteur total) ---
  # Les 4 capteurs "internal" ci-dessous (spike/peak/flat/valley, tarifs horaires
  # non utilisés ici) bridgent le trou entre 0x000A et 0x0014 pour que les deux
  # compteurs import/export soient lus en 1 seule requête Modbus au lieu de 2.

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Active Importée"
    id: acrel_energy_import
    register_type: holding
    address: 0x000A # Current forward active total energy, résolution 0.01kWh
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Pointe (non utilisé)"
    id: acrel_energy_import_spike
    internal: true
    register_type: holding
    address: 0x000C
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Pleine (non utilisé)"
    id: acrel_energy_import_peak
    internal: true
    register_type: holding
    address: 0x000E
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Normale (non utilisé)"
    id: acrel_energy_import_flat
    internal: true
    register_type: holding
    address: 0x0010
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Creuse (non utilisé)"
    id: acrel_energy_import_valley
    internal: true
    register_type: holding
    address: 0x0012
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Active Exportée"
    id: acrel_energy_export
    register_type: holding
    address: 0x0014 # Current reversing active total energy, résolution 0.01kWh
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  # --- ENERGIE PAR PHASE ACREL (L1/L2/L3, même bloc registre 0x0087-0x008B) ---
  # L2 = circuit dédié EVSE. L1/L3 ajoutés pour bridger le bloc en 1 seule requête
  # (gain marginal, mais donne aussi la donnée par phase gratuitement).

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée L1"
    id: acrel_energy_import_l1
    register_type: holding
    address: 0x0087 # Forward active energy of A phase
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée L2 (EV)"
    id: acrel_energy_import_l2
    register_type: holding
    address: 0x0089 # Forward active energy of B phase (même canal que Courant/Puissance L2)
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée L3"
    id: acrel_energy_import_l3
    register_type: holding
    address: 0x008B # Forward active energy of C phase
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  # --- ENERGIE LINKY ---

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EAST"
    name: "Linky Index Consommation"
    id: linky_east
    unit_of_measurement: "Wh"
    icon: mdi:gauge
    device_class: energy
    state_class: total_increasing

  # Index par cadran tarifaire (contrat HC/HP, cf. "Linky Tarif en cours" qui
  # bascule entre HEURE CREUSE/HEURE PLEINE) : EASF01 = index Heures Creuses,
  # EASF02 = index Heures Pleines. EAST ci-dessus reste le total des deux.
  # EASF01+EASF02 ne collait pas exactement à EAST sur le terrain (écart
  # ~84.6kWh) -> EASF03/EASF04 ajoutés pour vérifier si le calendrier
  # fournisseur (cf. NGTF ci-dessous) a plus de 2 cadrans que HC/HP simple.
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EASF01"
    name: "Linky Index Heures Creuses"
    id: linky_easf01
    unit_of_measurement: "Wh"
    icon: mdi:weather-night
    device_class: energy
    state_class: total_increasing

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EASF02"
    name: "Linky Index Heures Pleines"
    id: linky_easf02
    unit_of_measurement: "Wh"
    icon: mdi:weather-sunny
    device_class: energy
    state_class: total_increasing

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EASF03"
    name: "Linky Index Cadran 3"
    unit_of_measurement: "Wh"
    icon: mdi:weather-partly-cloudy
    device_class: energy
    state_class: total_increasing

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EASF04"
    name: "Linky Index Cadran 4"
    unit_of_measurement: "Wh"
    icon: mdi:weather-partly-cloudy
    device_class: energy
    state_class: total_increasing

  # --- TENSION / COURANT / PUISSANCE INSTANTANES LINKY (installation monophasée) ---

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "URMS1"
    name: "Linky Tension"
    id: linky_urms1
    unit_of_measurement: "V"
    accuracy_decimals: 0
    icon: mdi:sine-wave
    device_class: voltage
    state_class: measurement

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "IRMS1"
    name: "Linky Courant"
    id: linky_irms1
    unit_of_measurement: "A"
    accuracy_decimals: 0
    icon: mdi:current-ac
    device_class: current
    state_class: measurement

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "SINSTS"
    name: "Linky Puissance Apparente Instantanée"
    id: linky_sinsts
    unit_of_measurement: "VA"
    accuracy_decimals: 0
    icon: mdi:flash
    device_class: apparent_power
    state_class: measurement

  # Max du jour (remis à zéro à minuit côté compteur), à comparer à PREF pour
  # contextualiser "Linky Dépassement Puissance Référence" (cf. décodage STGE).
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "SMAXSN"
    name: "Linky Puissance Apparente Max du Jour"
    unit_of_measurement: "VA"
    accuracy_decimals: 0
    icon: mdi:flash-alert
    device_class: apparent_power
    state_class: measurement

  # Puissance de référence souscrite auprès du fournisseur (kVA) : le seuil
  # dont le dépassement est signalé par le bit 7 de STGE.
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "PREF"
    name: "Linky Puissance de Référence Souscrite"
    id: linky_pref
    unit_of_measurement: "kVA"
    accuracy_decimals: 0
    icon: mdi:flash-outline
    device_class: apparent_power
    state_class: measurement
    entity_category: diagnostic

# --- TEXT SENSOR POUR LE LINKY (Déclenchement HC/HP) ---

text_sensor:
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "LTARF" # Optionnel : remonte le nom du tarif en cours ("HEURE CREUSE", "HEURE PLEINE"...)
    name: "Linky Tarif en cours"
    id: linky_ltarf

  # Nom du calendrier tarifaire fournisseur (ex: "HC/HP", "BASE", "TEMPO"...) :
  # permet de savoir combien de cadrans EASFxx sont réellement utilisés par
  # le contrat, pour expliquer l'écart EASF01+EASF02 != EAST observé sur site.
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "NGTF"
    name: "Linky Calendrier Tarifaire"

  # STGE = registre de statuts du Linky (8 hex = 32 bits), tag numérique au sens
  # TIC mais pas une grandeur décimale -> passe par text_sensor (teleinfo.sensor
  # fait un parse_number<float> qui échouerait sur du hex). Décodé bit à bit
  # ci-dessous vers des binary_sensor à chaque nouvelle valeur (cf. Enedis-NOI-CPT_54E) :
  # bit 6 = surtension sur une des phases, bit 7 = dépassement de puissance de référence.
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "STGE"
    name: "Linky Registre de Statuts (brut)"
    id: linky_stge
    icon: mdi:information-outline
    on_value:
      then:
        - lambda: |-
            uint32_t stge = strtoul(x.c_str(), nullptr, 16);
            id(linky_depassement_puissance).publish_state((stge & (1u << 7)) != 0);
            id(linky_surtension).publish_state((stge & (1u << 6)) != 0);
        # Log explicite (indépendant du binary_sensor) : BinarySensor n'émet pas
        # d'évènement d'état/API au tout premier publish_state() du boot (évite
        # de déclencher les automatisations sur l'état par défaut), donc sans ce
        # log la toute première valeur ne serait jamais visible dans "esphome logs".
        - logger.log:
            format: "Linky STGE=%s -> dépassement puissance=%d, surtension=%d"
            args:
              - x.c_str()
              - id(linky_depassement_puissance).state
              - id(linky_surtension).state

binary_sensor:
  - platform: template
    id: linky_depassement_puissance
    name: "Linky Dépassement Puissance Référence"
    device_class: problem

  - platform: template
    id: linky_surtension
    name: "Linky Surtension"
    device_class: problem

# =====================================================================
# 4. BOUCLE D'ENVOI API VERS LE SMARTEVSE (Toutes les 3s)
# =====================================================================

interval:
  - interval: 3s # comme le script Berry : moins fréquent = moins de blocages, largement sous le timeout 11s de SmartEVSE
    id: smartevse_feed
    then:
      - if:
          condition:
            lambda: |-
              return id(acrel_current_l1).has_state() &&
                     id(acrel_current_l2).has_state() &&
                     id(acrel_current_l3).has_state() &&
                     id(acrel_active_power_l2).has_state() &&
                     id(acrel_energy_import_l2).has_state() &&
                     id(smartevse_mqtt).is_connected();
          then:
            # --- CALCULS ---
            - lambda: |-
                float l1 = id(acrel_current_l1).state;
                float l2 = id(acrel_current_l2).state;
                float l3 = id(acrel_current_l3).state;

                // Maison globale = L1 + L2 + L3 (car tout est en mono)
                float mains_total = l1 + l2 + l3;

                id(smartevse_mains_da) = (int)(mains_total * 10.0);
                id(smartevse_ev_da) = (int)(l2 * 10.0);

                // Puissance/énergie EV : canal L2/Phase B = circuit dédié EVSE.
                // /ev_meter n'actualise import_active_power/energy que si les 3 paramètres
                // (import_active_power, import_active_energy, export_active_energy) sont
                // envoyés ensemble (cf. http_handlers.cpp du fork basmeerman) ; L1/L2/L3
                // seuls ne mettent à jour que les courants, pas la puissance/énergie affichée.
                id(smartevse_ev_power_w) = (int)(id(acrel_active_power_l2).state * 1000.0);
                id(smartevse_ev_energy_wh) = (int)(id(acrel_energy_import_l2).state * 1000.0);

            # --- ENVOI MAINS METER (Réseau global simulé sur L1) ---
            # Format payload = mqtt_parse_mains_meter() du fork basmeerman : "L1:L2:L3" en dA.
            - mqtt.publish:
                topic: "SmartEVSE/8931/Set/MainsMeter"
                payload: !lambda |-
                  return to_string(id(smartevse_mains_da)) + ":0:0";
                qos: 1

            - logger.log:
                format: "SmartEVSE MQTT MainsMeter published: L1=%d"
                args: [id(smartevse_mains_da)]

            # --- ENVOI EV METER (topic Set/EVMeter, cf. mqtt_parser.c du fork basmeerman) ---
            # Nécessite EVMeter = "API" dans la config SmartEVSE. Format payload = "L1:L2:L3:W:Wh"
            # en un seul message (contrairement au REST /ev_meter, pas besoin d'envoyer les 5
            # paramètres séparément ni de les grouper en 2 lots).
            - mqtt.publish:
                topic: "SmartEVSE/8931/Set/EVMeter"
                payload: !lambda |-
                  return to_string(id(smartevse_ev_da)) + ":0:0:" +
                         to_string(id(smartevse_ev_power_w)) + ":" +
                         to_string(id(smartevse_ev_energy_wh));
                qos: 1

            - logger.log:
                format: "SmartEVSE MQTT EVMeter published: L1=%d P=%dW E=%dWh"
                args: [id(smartevse_ev_da), id(smartevse_ev_power_w), id(smartevse_ev_energy_wh)]

# =====================================================================
# 5. BOUCLE D'ENVOI TELEMETRIE LINKY VERS LE SMARTEVSE (Toutes les 10s)
# =====================================================================
# Le fork basmeerman ne peuple MainsMeter.linky.* (tarif HP/HC, tension,
# courant, puissance apparente, index d'énergie) que via une lecture Modbus
# directe (registres 500/600, cf. tic-din-modbus) OU, depuis l'ajout du topic
# /Set/LinkyMeter (mqtt_parser.c), via ce flux MQTT. Sans ce bloc, le badge
# "Linky" de l'UI SmartEVSE reste bloqué sur "No signal (meter unavailable)"
# même si le mains meter (Acrel, ci-dessus) fonctionne : ce sont deux flux
# indépendants côté SmartEVSE (MainsMeter.Type=API pour les courants, Linky
# séparément pour le tarif/la tension/l'énergie).
# Cadence 10s (au lieu de 3s comme la boucle mains/EV) : le staleness timeout
# côté SmartEVSE est de 300s (LINKY_MQTT_STALE_TIMEOUT_S), et le tarif HP/HC
# ne change de toute façon qu'une à deux fois par jour.
# Payload = mqtt_parse_linky_meter() du fork basmeerman :
# "is_hp:is_hc:is_power_overflow:voltage_l1:current_l1:apparent_power:
#  active_energy_total:contracted_power:total_hp:total_hc"
# (2e entrée de la liste "interval" déclarée section 4 : ESPHome interdit une
# 2e clé top-level "interval:", donc ceci prolonge la même liste YAML.)
  - interval: 10s
    id: smartevse_linky_feed
    then:
      - if:
          condition:
            lambda: |-
              return id(linky_ltarf).has_state() &&
                     id(linky_urms1).has_state() &&
                     id(linky_irms1).has_state() &&
                     id(linky_sinsts).has_state() &&
                     id(linky_east).has_state() &&
                     id(linky_pref).has_state() &&
                     id(linky_easf01).has_state() &&
                     id(linky_easf02).has_state() &&
                     id(smartevse_mqtt).is_connected();
          then:
            # --- CALCULS ---
            # Contrat HC/HP (cf. NGTF="H PLEINE/CREUSE") : LTARF vaut "HEURE
            # PLEINE"/"HEURE CREUSE" en mode Standard. Pas de gestion Tempo/BASE
            # ici (hors périmètre du contrat installé) -> is_hp=is_hc=0 dans ces
            # cas, comme le ferait un flux Modbus tic-din-modbus absent.
            - lambda: |-
                std::string tarf = id(linky_ltarf).state;
                id(smartevse_linky_is_hp) = (tarf.find("PLEINE") != std::string::npos) ? 1 : 0;
                id(smartevse_linky_is_hc) = (tarf.find("CREUSE") != std::string::npos) ? 1 : 0;

            # --- ENVOI LINKY METER (topic Set/LinkyMeter, cf. mqtt_parser.c du fork basmeerman) ---
            # Format payload = mqtt_parse_linky_meter() : "is_hp:is_hc:is_power_overflow:
            # voltage_l1:current_l1:apparent_power:active_energy_total:contracted_power:
            # total_hp:total_hc" en un seul message.
            - mqtt.publish:
                topic: "SmartEVSE/8931/Set/LinkyMeter"
                payload: !lambda |-
                  int overflow = id(linky_depassement_puissance).state ? 1 : 0;
                  return to_string(id(smartevse_linky_is_hp)) + ":" +
                         to_string(id(smartevse_linky_is_hc)) + ":" +
                         to_string(overflow) + ":" +
                         to_string(id(linky_urms1).state) + ":" +
                         to_string(id(linky_irms1).state) + ":" +
                         to_string(id(linky_sinsts).state) + ":" +
                         to_string(id(linky_east).state) + ":" +
                         to_string(id(linky_pref).state) + ":" +
                         to_string(id(linky_easf02).state) + ":" +
                         to_string(id(linky_easf01).state);
                qos: 1

            - logger.log:
                format: "SmartEVSE MQTT LinkyMeter published: is_hp=%d is_hc=%d"
                args: [id(smartevse_linky_is_hp), id(smartevse_linky_is_hc)]

# =====================================================================
# 6. BOUCLE DLB (DYNAMIC LOAD BALANCING) ETEK (Toutes les 5s)
# =====================================================================
# Plafonne le courant de charge ETEK (écriture registre 109, cf. section "number"
# ci-dessus) pour que le courant total maison (Acrel L1+L2+L3) ne dépasse jamais la
# puissance souscrite Linky (PREF), avec une marge de sécurité. Le courant "disponible"
# pour l'EV = PREF converti en ampères (via la tension Linky mesurée en direct) moins ce
# que tirent déjà les deux autres circuits (L1+L3, hors EV = L2).
#
# Cadence 5s : assez réactif face à un gros appel de puissance sur L1/L3, sans saturer
# le bus 9600 bauds déjà partagé avec les lectures Acrel (2s) et ETEK (2s).
#
# IEC 61851-1 : pas de courant de charge < 6A -> en dessous, on met en pause (registre
# 89 = 2) plutôt que d'envoyer une valeur hors norme.
#
# Anti-oscillation : une BAISSE de courant est appliquée immédiatement (priorité à la
# sécurité du disjoncteur en cas de gros appel soudain sur un autre circuit) ; une
# HAUSSE doit être confirmée sur 3 cycles consécutifs (~15s) avant d'être écrite, pour
# ne pas faire varier le courant de charge à chaque fluctuation transitoire.
#
# (3e entrée de la liste "interval" déclarée section 4 : ESPHome interdit une 2e clé
# top-level "interval:", donc ceci prolonge la même liste YAML.)
  - interval: 5s
    id: etek_dlb
    then:
      - if:
          condition:
            lambda: |-
              return id(acrel_current_l1).has_state() &&
                     id(acrel_current_l3).has_state() &&
                     id(linky_pref).has_state() &&
                     id(linky_urms1).has_state() &&
                     id(linky_depassement_puissance).has_state();
          then:
            - lambda: |-
                const int ETEK_MIN_A = 6;       // plancher IEC 61851
                const int ETEK_MAX_A = 32;      // disjoncteur du circuit ETEK (Rangée L2)
                const int REG109_SCALE = 167;   // cf. evcc-io/evcc#18550, non calibré indépendamment sur ce firmware
                const float SAFETY_MARGIN_A = 2.0f;
                const int CONFIRM_CYCLES = 3;   // ~15s à 5s/cycle

                float non_ev_a = id(acrel_current_l1).state + id(acrel_current_l3).state;
                float max_total_a = (id(linky_pref).state * 1000.0f) / id(linky_urms1).state;
                float headroom_a = max_total_a - non_ev_a - SAFETY_MARGIN_A;

                // Dépassement de puissance déjà signalé par le Linky (bit STGE) : coupe
                // court, pas la peine d'attendre que le calcul normal rattrape la réalité.
                if (id(linky_depassement_puissance).state) {
                  headroom_a = 0.0f;
                }

                int target_a = (int)floorf(headroom_a); // floor = ne jamais arrondir au-dessus du réel disponible
                if (target_a > ETEK_MAX_A) target_a = ETEK_MAX_A;
                if (target_a < 0) target_a = 0;

                bool should_pause = (target_a < ETEK_MIN_A);
                int applied_a = should_pause ? 0 : target_a;

                // --- Activation (registre 89) ---
                int want_enabled = should_pause ? 2 : 0; // cf. evcc#18550 : 0=actif, 2=arrêt d'urgence
                if (id(etek_dlb_enabled) != want_enabled) {
                  id(etek_epc2_reg89).make_call().set_value(want_enabled).perform();
                  id(etek_dlb_enabled) = want_enabled;
                  ESP_LOGI("etek_dlb", "Registre 89 -> %d (%s)", want_enabled, should_pause ? "pause" : "actif");
                }

                if (should_pause) {
                  id(etek_dlb_pending_count) = 0; // reset l'anti-oscillation pendant une pause
                  ESP_LOGI("etek_dlb", "DLB: headroom=%.1fA < %dA -> pause charge", headroom_a, ETEK_MIN_A);
                } else {
                  int last_a = id(etek_dlb_last_current_a);

                  if (last_a < 0 || applied_a <= last_a) {
                    // Première écriture, ou baisse : appliquée tout de suite (sécurité disjoncteur).
                    if (applied_a != last_a) {
                      id(etek_epc2_reg109).make_call().set_value(applied_a * REG109_SCALE).perform();
                      id(etek_dlb_last_current_a) = applied_a;
                      ESP_LOGI("etek_dlb", "DLB: cible=%dA (headroom=%.1fA) -> écrit reg109=%d",
                               applied_a, headroom_a, applied_a * REG109_SCALE);
                    }
                    id(etek_dlb_pending_count) = 0;
                  } else {
                    // Hausse : exige confirmation sur CONFIRM_CYCLES cycles consécutifs identiques.
                    if (applied_a == id(etek_dlb_pending_target_a)) {
                      id(etek_dlb_pending_count) += 1;
                    } else {
                      id(etek_dlb_pending_target_a) = applied_a;
                      id(etek_dlb_pending_count) = 1;
                    }

                    if (id(etek_dlb_pending_count) >= CONFIRM_CYCLES) {
                      id(etek_epc2_reg109).make_call().set_value(applied_a * REG109_SCALE).perform();
                      id(etek_dlb_last_current_a) = applied_a;
                      id(etek_dlb_pending_count) = 0;
                      ESP_LOGI("etek_dlb", "DLB: hausse confirmée=%dA (headroom=%.1fA) -> écrit reg109=%d",
                               applied_a, headroom_a, applied_a * REG109_SCALE);
                    } else {
                      ESP_LOGD("etek_dlb", "DLB: hausse candidate=%dA (actuel=%dA), confirmation %d/%d",
                               applied_a, last_a, id(etek_dlb_pending_count), CONFIRM_CYCLES);
                    }
                  }
                }

logger:
  level: DEBUG

debug:
