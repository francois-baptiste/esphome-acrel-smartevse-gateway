esphome:
  name: passerelle-energie-waveshare

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf  # Essentiel pour la stabilité de l'UART/Modbus sur l'ESP32-S3
    # Épinglé (au lieu du "recommended" 5.5.4) : le mécanisme de "response
    # files" du toolchain CMake de 5.5.4 génère des fichiers
    # cflags/cxxflags/asmflags/ldflags vides plutôt que peuplés (bug
    # d'amorçage CMake/IDF), provoquant des "dangerous relocation: call8"
    # au link faute des flags d'architecture (-mlongcalls etc.).
    # 5.3.5 s'est avéré trop ancien (wifi_scan_config_t.coex_background_scan
    # manquant, requis par le composant wifi de cette version d'ESPHome).
    # 5.4.4 = compromis : assez récent pour l'API wifi, sans le bug 5.5.x.
    version: "5.4.4"

# Principe "offline-first" : la boucle DLB tourne en local (Modbus + Teleinfo filaires).
# Aucune perte reseau (Wi-Fi, broker MQTT, client API) ne doit redemarrer l'ESP32 : un reboot
# pendant une charge efface l'etat du DLB. D'ou reboot_timeout: 0s sur wifi / api / mqtt.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

web_server:
  port: 80

# Broker MQTT : ESPHome y publie l'état de chaque entité sur
# "<node_name>/<domain>/<object_id>/state" (consommé par Telegraf -> InfluxDB).
mqtt:
  reboot_timeout: 0s
  broker: "37.187.129.84"
  port: 1883
  discovery: false # pas de découverte Home Assistant ; la publication des états reste active

globals:
  # --- Etat de la boucle DLB ETEK (cf. section 4) ---
  - id: etek_dlb_last_current_a
    type: int
    initial_value: '-1' # dernier courant (A) réellement écrit en registre 109 ; -1 = jamais écrit

  - id: etek_dlb_enabled
    type: int
    initial_value: '-1' # dernière valeur connue du registre 89 (0=actif, 2=pause) ; -1 = inconnu, force une écriture au 1er cycle

  - id: etek_dlb_pending_target_a
    type: int
    initial_value: '0' # cible en hausse en attente de confirmation (anti-oscillation, cf. section 4)

  - id: etek_dlb_pending_count
    type: int
    initial_value: '0'

  - id: dlb_pending_dir
    type: int
    initial_value: '0' # sens du changement en attente de confirmation : +1 hausse, -1 baisse modérée, 0 aucun

  - id: dlb_pause_count
    type: int
    initial_value: '0' # cycles consécutifs avec headroom < plancher (déclenche la pause à PAUSE_CYCLES)

  - id: dlb_resume_count
    type: int
    initial_value: '0' # cycles consécutifs avec headroom > seuil de reprise, pendant une pause

  # Horodatages (millis) de la dernière mise à jour de chaque entrée de la boucle DLB.
  - id: dlb_acrel_l1_ms
    type: uint32_t
    initial_value: '0'

  - id: dlb_acrel_l2_ms
    type: uint32_t
    initial_value: '0'

  - id: dlb_acrel_l3_ms
    type: uint32_t
    initial_value: '0'

  - id: dlb_linky_ms
    type: uint32_t
    initial_value: '0'

  # Dernières valeurs calculées par la boucle, exposées en télémétrie (capteurs template ci-dessous).
  - id: dlb_headroom_a
    type: float
    initial_value: '0'

  - id: dlb_limit_a
    type: float
    initial_value: '0'

  - id: dlb_total_a
    type: float
    initial_value: '0'

  - id: dlb_target_a
    type: int
    initial_value: '0'

  - id: dlb_frozen
    type: int
    initial_value: '0'

  - id: dlb_stale
    type: int
    initial_value: '0'

# =====================================================================
# 1. DECLARATION DES DEUX PORTS SERIE (UART) WAVESHARE
# =====================================================================
uart:
  # Port A : Pour le RS485 de l'Acrel (Bornier Vert)
  - id: modbus_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    # tx_enable_pin retiré d'ici ! (piloté par modbus: flow_control_pin)
    # 9600 : l'ETEK EKEPC2-C ne répond en réalité qu'à 9600 (confirmé par test
    # direct PC/USB-RS485), malgré le manuel constructeur qui annonce 38400,n,8,1
    # fixe. L'Acrel a été reconfiguré en conséquence pour rester sur le même bus.
    baud_rate: 9600
    data_bits: 8
    # L'ADL400 Acrel sort d'usine en 8N1 (parité NONE). EVEN empêchait
    # toute réponse du compteur (trames rejetées côté esclave).
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256

  # Port B : Pour la Téléinfo (Connecteur SH1.0)
  - id: teleinfo_uart
    # GPIO2 = pin data documentée par le wiki Waveshare pour le connecteur
    # SH1.0 (GND/3V3/GPIO2/GPIO1). GPIO1, GPIO11 et GPIO12 testés en
    # diagnostic sans succès (0 octet reçu sur les 4) : le problème n'est
    # plus une histoire de mapping de pin, cf. investigation matérielle.
    rx_pin: GPIO2
    baud_rate: 9600
    # La trame TIC (Historique ET Standard) est toujours 7E1 (7 bits + parité
    # paire), seul le débit change entre les deux modes (1200 vs 9600 bauds).
    # 8N1 laissait le composant teleinfo lever "Invalid number of data bits"
    # / "Invalid parity" au boot et aucune trame n'était décodée (bit de parité
    # mal interprété comme 8e bit de données -> désynchronisation de trame).
    data_bits: 7
    parity: EVEN
    stop_bits: 1

# =====================================================================
# 2. CONFIGURATION DES PROTOCOLES
# =====================================================================
modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: GPIO21  # Pilote le sens RS485 (EN sur le schéma Waveshare)
  # Défaut ESPHome = 600ms de silence forcé après CHAQUE commande, indépendant du baud rate.
  # C'est le vrai goulot d'étranglement du cycle de lecture (~8 groupes de registres/cycle).
  # Réduit à 100ms ; si des erreurs/timeouts Modbus apparaissent dans les logs, remonter la valeur.
  turnaround_time: 100ms

modbus_controller:
  - id: acrel_adl400
    address: 0x0B
    modbus_id: modbus_bus
    # Défaut ESPHome = 60s. Remonté à 2s pour des données plus fraîches ; le bus est
    # maintenant à 9600 (au lieu de 38400) pour rester compatible avec l'ETEK, donc
    # chaque octet prend 4x plus de temps qu'avant -> si des timeouts/"Duplicate
    # modbus command" apparaissent dans les logs, redescendre cette valeur.
    update_interval: 2s

  # ETEK EKEPC2-C : adresse Modbus fixée à 100 (0x64) via écriture registre 100
  # ("Device address number") depuis un adaptateur USB-RS485 externe, en remplacement
  # de l'adresse de diffusion 255 sortie d'usine. Bus confirmé fonctionnel à 9600,n,8,1.
  - id: etek_epc2
    address: 0x64
    modbus_id: modbus_bus
    update_interval: 2s

# Cibles d'écriture Modbus pour le plafonnement de courant ETEK (boucle DLB, section 4).
# Registre 109 ("Maximum output PWM duty cycle of charging pile", lecture/écriture) :
# facteur d'échelle = ampères * 167 (source : evcc-io/evcc#18550). CONFIRMÉ sur ce
# firmware le 2026-10-08 : cible loggée 16A (brut 2672) vs courant réellement mesuré
# côté Acrel L2 (indépendant de l'ETEK) = 15.85-15.92A, écart <1%, cohérent avec le
# bruit de mesure normal. Ne pas recalibrer sans raison.
# ATTENTION : registre 146 ("ETEK EPC2 Courant de charge", cf. section sensor ci-dessous)
# et les registres voisins 148/149 (tension/puissance) sont eux NON FIABLES sur ce
# firmware -> ils affichent ~0 pendant que l'Acrel L2 mesure ~16A/234V/~3.7kW réels au
# même instant. Ne pas s'y fier pour du diagnostic ou pour une future boucle de
# feedback ; la boucle DLB n'en dépend pas (elle utilise Acrel + Linky), donc ce bug
# ne l'affecte pas, mais les sensors eux-mêmes affichent des valeurs fausses dans l'UI.
# Registre 89 : écrit par la boucle DLB pour mettre en pause (2) ou réactiver (0) la
# charge quand le courant disponible tombe sous le plancher IEC 61851 (6A) ; même
# source evcc-io/evcc#18550, non vérifié indépendamment (nécessiterait de provoquer
# un vrai dépassement de PREF), mais cohérent avec le comportement observé.
# Ces deux entités "number" restent exposées (Web UI/API) pour override manuel/debug ;
# la valeur brute (pas l'ampérage) est ce qui est stocké/affiché, volontairement sans
# filtre "multiply" pour ne pas masquer la valeur réellement écrite sur le bus.
number:
  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Registre 109 (courant max, brut = A x 167)"
    id: etek_epc2_reg109
    register_type: holding
    address: 109
    value_type: U_WORD
    min_value: 0
    max_value: 6000
    step: 1
    mode: box

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Registre 89 (activation : 0=actif, 2=pause)"
    id: etek_epc2_reg89
    register_type: holding
    address: 89
    value_type: U_WORD
    min_value: 0
    max_value: 2
    step: 2
    mode: box

teleinfo:
  id: linky_tic
  uart_id: teleinfo_uart
  historical_mode: false # Linky en mode Standard

# =====================================================================
# 3. CAPTEURS (Acrel et Linky)
# =====================================================================

sensor:
  # --- ETEK EKEPC2-C (registres documentés Usage-Manual-for-EKEPC2-C-S.pdf p.26-27) ---

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Statut"
    id: etek_epc2_status
    register_type: holding
    address: 141 # "Current working status", codes 0-13 (cf. table LED p.14 pour la correspondance)
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Courant de charge"
    id: etek_epc2_current
    register_type: holding
    address: 146 # "Current value of charging pile 0-200.0A"
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Tension"
    id: etek_epc2_voltage
    register_type: holding
    address: 148 # "Current voltage value of charging pile 0-500.0V"
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: etek_epc2
    name: "ETEK EPC2 Puissance"
    id: etek_epc2_power
    register_type: holding
    address: 149 # "Current power value of charging pile 0-22000W"
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  # --- COURANTS ACREL (Pour le calcul Monophasé) ---

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Courant L1 (Rangée 1)"
    id: acrel_current_l1
    register_type: holding
    address: 0x0064 # Confirmé datasheet ADL400 : résolution 0.01A
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "A"
    on_value:
      - lambda: id(dlb_acrel_l1_ms) = millis();

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Courant L2 (Voiture EV)"
    id: acrel_current_l2
    register_type: holding
    address: 0x0065
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "A"
    on_value:
      - lambda: id(dlb_acrel_l2_ms) = millis();

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Courant L3 (Rangée 2)"
    id: acrel_current_l3
    register_type: holding
    address: 0x0066
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "A"
    on_value:
      - lambda: id(dlb_acrel_l3_ms) = millis();

  # --- TENSIONS ACREL ---

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Tension L1"
    id: acrel_voltage_l1
    register_type: holding
    address: 0x0061 # Résolution 0.1V (manuel ADL400 §9.1)
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Tension L2"
    id: acrel_voltage_l2
    register_type: holding
    address: 0x0062
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Tension L3"
    id: acrel_voltage_l3
    register_type: holding
    address: 0x0063
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Fréquence"
    id: acrel_frequency
    register_type: holding
    address: 0x0077 # Résolution 0.01Hz
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "Hz"
    device_class: frequency

  # --- PUISSANCES ACREL ---
  # Registres 32 bits (2 mots). Si les valeurs lues sont aberrantes,
  # remplacer S_DWORD/U_DWORD par S_DWORD_R/U_DWORD_R (ordre des mots inversé).
  #
  # CONSOLIDATION LECTURES MODBUS : ESPHome ne fusionne des capteurs en une seule
  # requête que si leurs adresses sont STRICTEMENT contiguës (pas de "max gap"
  # configurable). Le bloc 0x0164-0x017F est un span continu de 28 registres dans
  # le datasheet (puissances actives/réactives/apparentes + cosphi, par phase et
  # total) : en ajoutant les capteurs par-phase qui manquaient (réactif/apparent/PF
  # A/B/C), ce bloc entier passe de 4 requêtes Modbus séparées à 1 seule, sans
  # rien sacrifier (les données par-phase sont utiles en plus). Gain estimé :
  # ~3 x turnaround_time (~300ms) par cycle de lecture.

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active L1"
    id: acrel_active_power_l1
    register_type: holding
    address: 0x0164 # Résolution 0.001kW
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active L2"
    id: acrel_active_power_l2
    register_type: holding
    address: 0x0166
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active L3"
    id: acrel_active_power_l3
    register_type: holding
    address: 0x0168
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active Totale"
    id: acrel_active_power_total
    register_type: holding
    address: 0x016A
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive L1"
    id: acrel_reactive_power_l1
    register_type: holding
    address: 0x016C # Résolution 0.001kvar
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive L2"
    id: acrel_reactive_power_l2
    register_type: holding
    address: 0x016E
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive L3"
    id: acrel_reactive_power_l3
    register_type: holding
    address: 0x0170
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive Totale"
    id: acrel_reactive_power_total
    register_type: holding
    address: 0x0172 # Résolution 0.001kvar
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente L1"
    id: acrel_apparent_power_l1
    register_type: holding
    address: 0x0174 # Résolution 0.001kVA
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente L2"
    id: acrel_apparent_power_l2
    register_type: holding
    address: 0x0176
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente L3"
    id: acrel_apparent_power_l3
    register_type: holding
    address: 0x0178
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente Totale"
    id: acrel_apparent_power_total
    register_type: holding
    address: 0x017A # Résolution 0.001kVA
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance L1"
    id: acrel_power_factor_l1
    register_type: holding
    address: 0x017C # Résolution 0.001
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance L2"
    id: acrel_power_factor_l2
    register_type: holding
    address: 0x017D
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance L3"
    id: acrel_power_factor_l3
    register_type: holding
    address: 0x017E
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance Totale"
    id: acrel_power_factor_total
    register_type: holding
    address: 0x017F # Résolution 0.001
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  # --- ENERGIE ACTIVE ACREL (Import/Export, compteur total) ---
  # Les 4 capteurs "internal" ci-dessous (spike/peak/flat/valley, tarifs horaires
  # non utilisés ici) bridgent le trou entre 0x000A et 0x0014 pour que les deux
  # compteurs import/export soient lus en 1 seule requête Modbus au lieu de 2.

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Active Importée"
    id: acrel_energy_import
    register_type: holding
    address: 0x000A # Current forward active total energy, résolution 0.01kWh
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Pointe (non utilisé)"
    id: acrel_energy_import_spike
    internal: true
    register_type: holding
    address: 0x000C
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Pleine (non utilisé)"
    id: acrel_energy_import_peak
    internal: true
    register_type: holding
    address: 0x000E
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Normale (non utilisé)"
    id: acrel_energy_import_flat
    internal: true
    register_type: holding
    address: 0x0010
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Creuse (non utilisé)"
    id: acrel_energy_import_valley
    internal: true
    register_type: holding
    address: 0x0012
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Active Exportée"
    id: acrel_energy_export
    register_type: holding
    address: 0x0014 # Current reversing active total energy, résolution 0.01kWh
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  # --- ENERGIE PAR PHASE ACREL (L1/L2/L3, même bloc registre 0x0087-0x008B) ---
  # L2 = circuit dédié EVSE. L1/L3 ajoutés pour bridger le bloc en 1 seule requête
  # (gain marginal, mais donne aussi la donnée par phase gratuitement).

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée L1"
    id: acrel_energy_import_l1
    register_type: holding
    address: 0x0087 # Forward active energy of A phase
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée L2 (EV)"
    id: acrel_energy_import_l2
    register_type: holding
    address: 0x0089 # Forward active energy of B phase (même canal que Courant/Puissance L2)
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée L3"
    id: acrel_energy_import_l3
    register_type: holding
    address: 0x008B # Forward active energy of C phase
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  # --- ENERGIE LINKY ---

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EAST"
    name: "Linky Index Consommation"
    id: linky_east
    unit_of_measurement: "Wh"
    icon: mdi:gauge
    device_class: energy
    state_class: total_increasing

  # Index par cadran tarifaire (contrat HC/HP, cf. "Linky Tarif en cours" qui
  # bascule entre HEURE CREUSE/HEURE PLEINE) : EASF01 = index Heures Creuses,
  # EASF02 = index Heures Pleines. EAST ci-dessus reste le total des deux.
  # EASF01+EASF02 ne collait pas exactement à EAST sur le terrain (écart
  # ~84.6kWh) -> EASF03/EASF04 ajoutés pour vérifier si le calendrier
  # fournisseur (cf. NGTF ci-dessous) a plus de 2 cadrans que HC/HP simple.
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EASF01"
    name: "Linky Index Heures Creuses"
    id: linky_easf01
    unit_of_measurement: "Wh"
    icon: mdi:weather-night
    device_class: energy
    state_class: total_increasing

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EASF02"
    name: "Linky Index Heures Pleines"
    id: linky_easf02
    unit_of_measurement: "Wh"
    icon: mdi:weather-sunny
    device_class: energy
    state_class: total_increasing

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EASF03"
    name: "Linky Index Cadran 3"
    unit_of_measurement: "Wh"
    icon: mdi:weather-partly-cloudy
    device_class: energy
    state_class: total_increasing

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EASF04"
    name: "Linky Index Cadran 4"
    unit_of_measurement: "Wh"
    icon: mdi:weather-partly-cloudy
    device_class: energy
    state_class: total_increasing

  # --- TENSION / COURANT / PUISSANCE INSTANTANES LINKY (installation monophasée) ---

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "URMS1"
    name: "Linky Tension"
    id: linky_urms1
    unit_of_measurement: "V"
    accuracy_decimals: 0
    icon: mdi:sine-wave
    device_class: voltage
    state_class: measurement

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "IRMS1"
    name: "Linky Courant"
    id: linky_irms1
    unit_of_measurement: "A"
    accuracy_decimals: 0
    icon: mdi:current-ac
    device_class: current
    state_class: measurement

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "SINSTS"
    name: "Linky Puissance Apparente Instantanée"
    id: linky_sinsts
    unit_of_measurement: "VA"
    accuracy_decimals: 0
    icon: mdi:flash
    device_class: apparent_power
    state_class: measurement

  # Max du jour (remis à zéro à minuit côté compteur), à comparer à PREF pour
  # contextualiser "Linky Dépassement Puissance Référence" (cf. décodage STGE).
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "SMAXSN"
    name: "Linky Puissance Apparente Max du Jour"
    unit_of_measurement: "VA"
    accuracy_decimals: 0
    icon: mdi:flash-alert
    device_class: apparent_power
    state_class: measurement

  # Puissance de référence souscrite auprès du fournisseur (kVA) : le seuil
  # dont le dépassement est signalé par le bit 7 de STGE.
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "PREF"
    name: "Linky Puissance de Référence Souscrite"
    id: linky_pref
    unit_of_measurement: "kVA"
    accuracy_decimals: 0
    icon: mdi:flash-outline
    device_class: apparent_power
    state_class: measurement
    entity_category: diagnostic
    on_value:
      - lambda: id(dlb_linky_ms) = millis();

  # --- TELEMETRIE DE LA BOUCLE DLB ETEK (publiée en MQTT -> Telegraf -> InfluxDB) ---
  # Capteurs template (et non binary_sensor/number) car Telegraf n'est abonné qu'à
  # "passerelle-energie-waveshare/sensor/+/state". Valeurs mises à jour toutes les 5 s.

  - platform: template
    name: "DLB Headroom brut"
    id: dlb_headroom_sensor
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: 'return id(dlb_headroom_a);'

  - platform: template
    name: "DLB Limite totale"
    id: dlb_limit_sensor
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: 'return id(dlb_limit_a);'

  - platform: template
    name: "DLB Courant total mesure"
    id: dlb_total_sensor
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: 'return id(dlb_total_a);'

  - platform: template
    name: "DLB Cible bornee"
    id: dlb_target_sensor
    unit_of_measurement: "A"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return (float) id(dlb_target_a);'

  - platform: template
    name: "DLB Consigne appliquee"
    id: dlb_applied_sensor
    unit_of_measurement: "A"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return (float) id(etek_dlb_last_current_a);' # -1 = jamais écrite

  - platform: template
    name: "DLB Consigne ETEK relue"
    id: dlb_readback_sensor
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      if (!id(etek_epc2_reg109).has_state()) return -1.0f;
      return id(etek_epc2_reg109).state / 167.0f;

  - platform: template
    name: "DLB Pause"
    id: dlb_paused_sensor
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(etek_dlb_enabled) == 2 ? 1.0f : 0.0f;'

  - platform: template
    name: "DLB Compteur pause"
    id: dlb_pause_count_sensor
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return (float) id(dlb_pause_count);'

  - platform: template
    name: "DLB Compteur reprise"
    id: dlb_resume_count_sensor
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return (float) id(dlb_resume_count);'

  - platform: template
    name: "DLB Confirmation en attente"
    id: dlb_pending_sensor
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return (float) (id(dlb_pending_dir) * id(etek_dlb_pending_count));' # signé : + hausse, - baisse

  - platform: template
    name: "DLB Gel taper"
    id: dlb_frozen_sensor
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return (float) id(dlb_frozen);'

  - platform: template
    name: "DLB Donnees perimees"
    id: dlb_stale_sensor
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return (float) id(dlb_stale);'

  - platform: template
    name: "DLB Depassement Linky"
    id: dlb_overshoot_sensor
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (!id(linky_depassement_puissance).has_state()) return -1.0f;
      return id(linky_depassement_puissance).state ? 1.0f : 0.0f;

# --- TEXT SENSOR POUR LE LINKY (Déclenchement HC/HP) ---

text_sensor:
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "LTARF" # Optionnel : remonte le nom du tarif en cours ("HEURE CREUSE", "HEURE PLEINE"...)
    name: "Linky Tarif en cours"
    id: linky_ltarf

  # Nom du calendrier tarifaire fournisseur (ex: "HC/HP", "BASE", "TEMPO"...) :
  # permet de savoir combien de cadrans EASFxx sont réellement utilisés par
  # le contrat, pour expliquer l'écart EASF01+EASF02 != EAST observé sur site.
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "NGTF"
    name: "Linky Calendrier Tarifaire"

  # STGE = registre de statuts du Linky (8 hex = 32 bits), tag numérique au sens
  # TIC mais pas une grandeur décimale -> passe par text_sensor (teleinfo.sensor
  # fait un parse_number<float> qui échouerait sur du hex). Décodé bit à bit
  # ci-dessous vers des binary_sensor à chaque nouvelle valeur (cf. Enedis-NOI-CPT_54E) :
  # bit 6 = surtension sur une des phases, bit 7 = dépassement de puissance de référence.
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "STGE"
    name: "Linky Registre de Statuts (brut)"
    id: linky_stge
    icon: mdi:information-outline
    on_value:
      then:
        - lambda: |-
            uint32_t stge = strtoul(x.c_str(), nullptr, 16);
            id(linky_depassement_puissance).publish_state((stge & (1u << 7)) != 0);
            id(linky_surtension).publish_state((stge & (1u << 6)) != 0);
        # Log explicite (indépendant du binary_sensor) : BinarySensor n'émet pas
        # d'évènement d'état/API au tout premier publish_state() du boot (évite
        # de déclencher les automatisations sur l'état par défaut), donc sans ce
        # log la toute première valeur ne serait jamais visible dans "esphome logs".
        - logger.log:
            format: "Linky STGE=%s -> dépassement puissance=%d, surtension=%d"
            args:
              - x.c_str()
              - id(linky_depassement_puissance).state
              - id(linky_surtension).state

binary_sensor:
  - platform: template
    id: linky_depassement_puissance
    name: "Linky Dépassement Puissance Référence"
    device_class: problem

  - platform: template
    id: linky_surtension
    name: "Linky Surtension"
    device_class: problem

# =====================================================================
# 4. BOUCLE DLB (DYNAMIC LOAD BALANCING) ETEK (Toutes les 5s)
# =====================================================================
# Plafonne le courant de charge ETEK (écriture registre 109, cf. section "number"
# ci-dessus) pour que le courant total maison (Acrel L1+L2+L3) reste sous la limite
# du disjoncteur de branchement (PREF/200 x 1,10, cf. mode agressif ci-dessous).
# Headroom brut = limite - (L1+L3), c'est-à-dire ce que tirent déjà les deux autres
# circuits ; le courant EV L2 mesuré ne sert qu'à détecter la fin de charge (taper).
#
# Cadence 5s : assez réactif face à un gros appel de puissance sur L1/L3, sans saturer
# le bus 9600 bauds déjà partagé avec les lectures Acrel (2s) et ETEK (2s).
#
# Écritures registre 109 (une seule par cycle, uniquement si nécessaire) :
#  - baisse >= 2 A par rapport à la consigne appliquée : immédiate (sécurité disjoncteur) ;
#  - baisse modérée (0,8 A < écart < 2 A) ou hausse >= 1 A : confirmée sur 2 cycles (~10 s).
#    Une consigne qui oscille de moins de 0,8 A autour du headroom n'est jamais réécrite
#    (supprime le va-et-vient 30/31 A et limite les écritures Modbus sur l'ETEK).
#
# Plancher IEC 61851-1 (6 A) : un headroom < 6 A ne met PAS tout de suite en pause. La
# consigne est d'abord bornée à 6 A ; la pause (registre 89 = 2) n'est déclenchée qu'après
# 3 cycles consécutifs (~15 s) sous 6 A, et la reprise qu'après 2 cycles > 8 A. Raison : après
# un registre 89 = 2 l'ETEK reste en statut 19 (hors service) pendant ~60 s quoi qu'on écrive
# ensuite, et la voiture signale "charge arrêtée" - une pause doit donc rester exceptionnelle.
#
# Fin de charge (taper) : tant que le courant L2 mesuré est > 2 A sous la consigne et que le
# headroom laisse >= 6 A d'écart au-dessus de ce que tire la voiture, la consigne est gelée
# (aucune écriture Modbus). Le gel saute dès que la charge d'un autre circuit l'exige.
#
# Données périmées : si une lecture Acrel (L1/L2/L3) a plus de 15 s, ou le Linky plus de 300 s
# (les capteurs teleinfo ne se mettent à jour qu'environ toutes les 100 s), la consigne passe
# à 10 A (jamais relevée tant qu'on est aveugle) ; la pause éventuelle est conservée.
interval:
  - interval: 5s
    id: etek_dlb
    then:
      - lambda: |-
          const int   ETEK_MIN_A = 6;       // plancher IEC 61851
          const int   ETEK_MAX_A = 32;      // disjoncteur du circuit ETEK (Rangée L2)
          const int   REG109_SCALE = 167;   // 167 unités brutes par ampère (confirmé sur ce firmware le 2026-10-08)
          // 0,3 A de marge pour compenser la bande morte ci-dessous : sans elle la consigne peut rester
          // jusqu'à 0,8 A au-dessus du headroom calculé (rejeu de la nuit du 19 au 20/10 : 26 % des cycles
          // au-dessus de la limite, pic +1,04 A). Avec 0,3 A : 8 % des cycles, pic +0,57 A, et le courant
          // moyen délivré reste identique à l'ancienne boucle (28,8 A). Remettre 0 pour charger au plus juste.
          const float SAFETY_MARGIN_A = 0.3f;
          // Mode agressif : le disjoncteur de branchement du Linky est calibré à PREF/200 V
          // (3kVA=15A, 6kVA=30A, 9kVA=45A...), pas à PREF/tension réelle. Sa courbe thermique
          // ne déclenche pas en dessous de ~1,13 x In (non-déclenchement conventionnel
          // IEC 60898, NON vérifié dans la doc Enedis) : on vise 1,10 x In. Validé par
          // l'usage : 32A pendant 2h sans coupure (~33A total pour In=30A).
          // Le bit STGE "dépassement puissance référence" n'est volontairement PAS utilisé :
          // le Linky le lève dès que S > PREF (ici 7436 VA > 6 kVA à 30A), ce qui est
          // normal dans ce mode et mettrait la charge en pause en boucle.
          const float BREAKER_OVERLOAD_FACTOR = 1.10f;

          const float DEADBAND_A = 0.8f;        // écart ignoré entre headroom et consigne appliquée
          const float EMERGENCY_STEP_A = 2.0f;  // baisse >= 2 A : écrite sans attendre
          const int   UP_CONFIRM = 2;           // cycles consécutifs pour une hausse
          const int   DOWN_CONFIRM = 2;         // cycles consécutifs pour une baisse modérée
          const int   PAUSE_CYCLES = 3;         // cycles sous ETEK_MIN_A avant pause (~15 s)
          const int   RESUME_CYCLES = 2;        // cycles au-dessus de RESUME_HEADROOM_A avant reprise
          const float RESUME_HEADROOM_A = 8.0f;
          const float TAPER_DETECT_A = 2.0f;    // L2 mesuré sous la consigne de plus de ça = fin de charge
          const float TAPER_ROOM_A = 6.0f;      // marge au-dessus de L2 sous laquelle le gel est levé
          const int   FALLBACK_A = 10;          // consigne en cas de données périmées
          const uint32_t ACREL_STALE_MS = 15000;
          const uint32_t LINKY_STALE_MS = 300000;
          const uint32_t BOOT_GRACE_MS = 20000;

          // ---------- Fraîcheur des données ----------
          const uint32_t now = millis();
          bool stale = !(id(acrel_current_l1).has_state() && id(acrel_current_l2).has_state() &&
                         id(acrel_current_l3).has_state() && id(linky_pref).has_state());
          if (!stale) {
            stale = (uint32_t)(now - id(dlb_acrel_l1_ms)) > ACREL_STALE_MS ||
                    (uint32_t)(now - id(dlb_acrel_l2_ms)) > ACREL_STALE_MS ||
                    (uint32_t)(now - id(dlb_acrel_l3_ms)) > ACREL_STALE_MS ||
                    (uint32_t)(now - id(dlb_linky_ms)) > LINKY_STALE_MS ||
                    std::isnan(id(acrel_current_l1).state) || std::isnan(id(acrel_current_l2).state) ||
                    std::isnan(id(acrel_current_l3).state) || std::isnan(id(linky_pref).state) ||
                    id(linky_pref).state < 1.0f;
          }
          id(dlb_stale) = stale ? 1 : 0;

          if (stale) {
            if (now < BOOT_GRACE_MS) return;  // les premières lectures n'ont pas encore eu lieu
            int last = id(etek_dlb_last_current_a);
            if (id(etek_dlb_enabled) != 2 && (last < 0 || last > FALLBACK_A)) {
              id(etek_epc2_reg109).make_call().set_value(FALLBACK_A * REG109_SCALE).perform();
              id(etek_dlb_last_current_a) = FALLBACK_A;
              ESP_LOGW("etek_dlb", "DLB: données périmées -> consigne de secours %dA (reg109=%d)",
                       FALLBACK_A, FALLBACK_A * REG109_SCALE);
            }
            id(etek_dlb_pending_count) = 0;
            id(dlb_pending_dir) = 0;
            id(dlb_pause_count) = 0;
            id(dlb_resume_count) = 0;
            return;
          }

          // ---------- Mesures et headroom ----------
          const float l1 = id(acrel_current_l1).state;
          const float l2 = id(acrel_current_l2).state;
          const float l3 = id(acrel_current_l3).state;
          const float total = l1 + l2 + l3;
          const float limit = id(linky_pref).state * 1000.0f / 200.0f * BREAKER_OVERLOAD_FACTOR;
          const float headroom = limit - (l1 + l3) - SAFETY_MARGIN_A;   // brut, peut être < 6 ou < 0
          // Borné au plancher/plafond ETEK : un creux bref de headroom donne 6 A, pas une pause.
          const float h = fminf(fmaxf(headroom, (float) ETEK_MIN_A), (float) ETEK_MAX_A);
          const int want = (int) floorf(h);   // floor = ne jamais arrondir au-dessus du réel disponible

          id(dlb_headroom_a) = headroom;
          id(dlb_limit_a) = limit;
          id(dlb_total_a) = total;
          id(dlb_target_a) = want;

          auto write_cap = [&](int amps, const char *why) {
            id(etek_epc2_reg109).make_call().set_value(amps * REG109_SCALE).perform();
            id(etek_dlb_last_current_a) = amps;
            id(etek_dlb_pending_count) = 0;
            id(dlb_pending_dir) = 0;
            ESP_LOGI("etek_dlb", "DLB: %s -> cible=%dA (headroom=%.1fA, L2=%.1fA, total=%.1f/%.1fA) -> reg109=%d",
                     why, amps, headroom, l2, total, limit, amps * REG109_SCALE);
          };

          // Premier cycle après démarrage : s'assurer que la charge est autorisée.
          if (id(etek_dlb_enabled) < 0) {
            id(etek_epc2_reg89).make_call().set_value(0).perform();
            id(etek_dlb_enabled) = 0;
          }

          // ---------- Pause / reprise ----------
          if (id(etek_dlb_enabled) == 2) {
            id(dlb_frozen) = 0;
            if (headroom > RESUME_HEADROOM_A) {
              id(dlb_resume_count) += 1;
            } else {
              id(dlb_resume_count) = 0;
            }
            if (id(dlb_resume_count) < RESUME_CYCLES) {
              ESP_LOGD("etek_dlb", "DLB: en pause (headroom=%.1fA, reprise %d/%d)",
                       headroom, id(dlb_resume_count), RESUME_CYCLES);
              return;
            }
            id(etek_epc2_reg89).make_call().set_value(0).perform();
            id(etek_dlb_enabled) = 0;
            id(dlb_resume_count) = 0;
            id(dlb_pause_count) = 0;
            id(etek_dlb_last_current_a) = -1;   // force une écriture de consigne à la reprise
            ESP_LOGI("etek_dlb", "DLB: reprise de la charge (headroom=%.1fA)", headroom);
          }

          int last = id(etek_dlb_last_current_a);

          // ---------- Fin de charge : consigne gelée ----------
          const bool tapering = last >= 0 && l2 < (float) last - TAPER_DETECT_A;
          const bool freeze = tapering && headroom >= l2 + TAPER_ROOM_A;
          id(dlb_frozen) = freeze ? 1 : 0;
          if (freeze) {
            id(etek_dlb_pending_count) = 0;
            id(dlb_pending_dir) = 0;
            id(dlb_pause_count) = 0;
            ESP_LOGD("etek_dlb", "DLB: taper (L2=%.1fA < consigne %dA), consigne gelée", l2, last);
            return;
          }

          // ---------- Pause après 3 cycles sous le plancher ----------
          if (headroom < (float) ETEK_MIN_A) {
            id(dlb_pause_count) += 1;
            if (id(dlb_pause_count) >= PAUSE_CYCLES) {
              id(etek_epc2_reg89).make_call().set_value(2).perform();
              id(etek_dlb_enabled) = 2;
              id(dlb_pause_count) = 0;
              id(dlb_resume_count) = 0;
              id(etek_dlb_pending_count) = 0;
              id(dlb_pending_dir) = 0;
              ESP_LOGI("etek_dlb", "DLB: headroom=%.1fA < %dA depuis %d cycles -> pause charge",
                       headroom, ETEK_MIN_A, PAUSE_CYCLES);
              return;
            }
            ESP_LOGD("etek_dlb", "DLB: headroom=%.1fA < %dA, borné à %dA (%d/%d avant pause)",
                     headroom, ETEK_MIN_A, ETEK_MIN_A, id(dlb_pause_count), PAUSE_CYCLES);
          } else {
            id(dlb_pause_count) = 0;
          }

          // ---------- Consigne : bande morte + confirmation ----------
          if (last < 0) {
            write_cap(want, "première écriture");
            return;
          }
          const float diff = h - (float) last;   // < 0 : la consigne dépasse le disponible
          if (diff <= -EMERGENCY_STEP_A) {
            write_cap(want, "baisse forte");
          } else if (diff < -DEADBAND_A) {
            if (id(dlb_pending_dir) == -1) {
              id(etek_dlb_pending_count) += 1;
            } else {
              id(dlb_pending_dir) = -1;
              id(etek_dlb_pending_count) = 1;
            }
            if (id(etek_dlb_pending_count) >= DOWN_CONFIRM) {
              write_cap(want, "baisse confirmée");
            }
          } else if (want > last) {
            if (id(dlb_pending_dir) == 1) {
              id(etek_dlb_pending_count) += 1;
              if (want < id(etek_dlb_pending_target_a)) id(etek_dlb_pending_target_a) = want;  // valeur la plus prudente de la fenêtre
            } else {
              id(dlb_pending_dir) = 1;
              id(etek_dlb_pending_count) = 1;
              id(etek_dlb_pending_target_a) = want;
            }
            if (id(etek_dlb_pending_count) >= UP_CONFIRM) {
              write_cap(id(etek_dlb_pending_target_a), "hausse confirmée");
            } else {
              ESP_LOGD("etek_dlb", "DLB: hausse candidate=%dA (actuel=%dA), confirmation %d/%d",
                       want, last, id(etek_dlb_pending_count), UP_CONFIRM);
            }
          } else {
            id(etek_dlb_pending_count) = 0;
            id(dlb_pending_dir) = 0;
          }

logger:
  level: DEBUG

