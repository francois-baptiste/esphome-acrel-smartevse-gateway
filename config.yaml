esphome:
  name: passerelle-energie-waveshare

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf  # Essentiel pour la stabilité de l'UART/Modbus sur l'ESP32-S3
    # Épinglé (au lieu du "recommended" 5.5.4) : le mécanisme de "response
    # files" du toolchain CMake de 5.5.4 génère des fichiers
    # cflags/cxxflags/asmflags/ldflags vides plutôt que peuplés (bug
    # d'amorçage CMake/IDF), provoquant des "dangerous relocation: call8"
    # au link faute des flags d'architecture (-mlongcalls etc.).
    # 5.3.5 s'est avéré trop ancien (wifi_scan_config_t.coex_background_scan
    # manquant, requis par le composant wifi de cette version d'ESPHome).
    # 5.4.4 = compromis : assez récent pour l'API wifi, sans le bug 5.5.x.
    version: "5.4.4"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

web_server:
  port: 80

# =====================================================================
# CLIENT MQTT POUR LE SMARTEVSE (remplace les POST HTTP /currents et /ev_meter)
# =====================================================================
# SmartEVSE (fork basmeerman) est déjà connecté à ce broker (cf. /settings ->
# mqtt.host) et son firmware sait consommer les topics Set/MainsMeter et
# Set/EVMeter (mqtt_parser.c). Le publish MQTT (petit payload, pas de
# handshake TCP+HTTP par cycle) est bien plus léger que le POST HTTP toutes
# les 3s, surtout ce broker étant sur Internet (pas sur le LAN local).
# topic_prefix "SmartEVSE/8931" = celui vu dans /settings au moment du
# déploiement ; à corriger si l'utilisateur change ce réglage côté SmartEVSE.
mqtt:
  id: smartevse_mqtt
  broker: "37.187.129.84"
  port: 1883
  discovery: false # on ne veut pas que ce client MQTT auto-publie/-découvre nos capteurs Acrel/Linky

globals:
  - id: smartevse_mains_da
    type: int
    initial_value: '0'

  - id: smartevse_ev_da
    type: int
    initial_value: '0'

  - id: smartevse_ev_power_w
    type: int
    initial_value: '0'

  - id: smartevse_ev_energy_wh
    type: int
    initial_value: '0'

# =====================================================================
# 1. DECLARATION DES DEUX PORTS SERIE (UART) WAVESHARE
# =====================================================================
uart:
  # Port A : Pour le RS485 de l'Acrel (Bornier Vert)
  - id: modbus_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    # tx_enable_pin retiré d'ici ! (piloté par modbus: flow_control_pin)
    baud_rate: 9600
    data_bits: 8
    # L'ADL400 Acrel sort d'usine en 8N1 (parité NONE). EVEN empêchait
    # toute réponse du compteur (trames rejetées côté esclave).
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256

  # Port B : Pour la Téléinfo (Connecteur SH1.0)
  - id: teleinfo_uart
    # GPIO2 = pin data documentée par le wiki Waveshare pour le connecteur
    # SH1.0 (GND/3V3/GPIO2/GPIO1). GPIO1, GPIO11 et GPIO12 testés en
    # diagnostic sans succès (0 octet reçu sur les 4) : le problème n'est
    # plus une histoire de mapping de pin, cf. investigation matérielle.
    rx_pin: GPIO2
    baud_rate: 9600
    # La trame TIC (Historique ET Standard) est toujours 7E1 (7 bits + parité
    # paire), seul le débit change entre les deux modes (1200 vs 9600 bauds).
    # 8N1 laissait le composant teleinfo lever "Invalid number of data bits"
    # / "Invalid parity" au boot et aucune trame n'était décodée (bit de parité
    # mal interprété comme 8e bit de données -> désynchronisation de trame).
    data_bits: 7
    parity: EVEN
    stop_bits: 1

# =====================================================================
# 2. CONFIGURATION DES PROTOCOLES
# =====================================================================
modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: GPIO21  # Pilote le sens RS485 (EN sur le schéma Waveshare)
  # Défaut ESPHome = 600ms de silence forcé après CHAQUE commande, indépendant du baud rate.
  # C'est le vrai goulot d'étranglement du cycle de lecture (~8 groupes de registres/cycle).
  # Réduit à 100ms ; si des erreurs/timeouts Modbus apparaissent dans les logs, remonter la valeur.
  turnaround_time: 100ms

modbus_controller:
  - id: acrel_adl400
    address: 0x0B
    modbus_id: modbus_bus
    # Défaut ESPHome = 60s. Avec turnaround_time réduit, un cycle complet tient dans ~1.5-2s,
    # donc on peut repasser le compteur à 3s pour que la boucle d'envoi SmartEVSE ait des
    # données fraîches à chaque itération plutôt que de renvoyer une valeur périmée.
    update_interval: 3s

teleinfo:
  id: linky_tic
  uart_id: teleinfo_uart
  historical_mode: false # Linky en mode Standard

# =====================================================================
# 3. CAPTEURS (Acrel et Linky)
# =====================================================================

sensor:
  # --- COURANTS ACREL (Pour le calcul Monophasé) ---

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Courant L1 (Rangée 1)"
    id: acrel_current_l1
    register_type: holding
    address: 0x0064 # Confirmé datasheet ADL400 : résolution 0.01A
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "A"

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Courant L2 (Voiture EV)"
    id: acrel_current_l2
    register_type: holding
    address: 0x0065
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "A"

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Courant L3 (Rangée 2)"
    id: acrel_current_l3
    register_type: holding
    address: 0x0066
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "A"

  # --- TENSIONS ACREL ---

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Tension L1"
    id: acrel_voltage_l1
    register_type: holding
    address: 0x0061 # Résolution 0.1V (manuel ADL400 §9.1)
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Tension L2"
    id: acrel_voltage_l2
    register_type: holding
    address: 0x0062
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Tension L3"
    id: acrel_voltage_l3
    register_type: holding
    address: 0x0063
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    unit_of_measurement: "V"
    device_class: voltage

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Fréquence"
    id: acrel_frequency
    register_type: holding
    address: 0x0077 # Résolution 0.01Hz
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "Hz"
    device_class: frequency

  # --- PUISSANCES ACREL ---
  # Registres 32 bits (2 mots). Si les valeurs lues sont aberrantes,
  # remplacer S_DWORD/U_DWORD par S_DWORD_R/U_DWORD_R (ordre des mots inversé).
  #
  # CONSOLIDATION LECTURES MODBUS : ESPHome ne fusionne des capteurs en une seule
  # requête que si leurs adresses sont STRICTEMENT contiguës (pas de "max gap"
  # configurable). Le bloc 0x0164-0x017F est un span continu de 28 registres dans
  # le datasheet (puissances actives/réactives/apparentes + cosphi, par phase et
  # total) : en ajoutant les capteurs par-phase qui manquaient (réactif/apparent/PF
  # A/B/C), ce bloc entier passe de 4 requêtes Modbus séparées à 1 seule, sans
  # rien sacrifier (les données par-phase sont utiles en plus). Gain estimé :
  # ~3 x turnaround_time (~300ms) par cycle de lecture.

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active L1"
    id: acrel_active_power_l1
    register_type: holding
    address: 0x0164 # Résolution 0.001kW
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active L2"
    id: acrel_active_power_l2
    register_type: holding
    address: 0x0166
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active L3"
    id: acrel_active_power_l3
    register_type: holding
    address: 0x0168
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Active Totale"
    id: acrel_active_power_total
    register_type: holding
    address: 0x016A
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive L1"
    id: acrel_reactive_power_l1
    register_type: holding
    address: 0x016C # Résolution 0.001kvar
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive L2"
    id: acrel_reactive_power_l2
    register_type: holding
    address: 0x016E
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive L3"
    id: acrel_reactive_power_l3
    register_type: holding
    address: 0x0170
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Réactive Totale"
    id: acrel_reactive_power_total
    register_type: holding
    address: 0x0172 # Résolution 0.001kvar
    value_type: S_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kvar"
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente L1"
    id: acrel_apparent_power_l1
    register_type: holding
    address: 0x0174 # Résolution 0.001kVA
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente L2"
    id: acrel_apparent_power_l2
    register_type: holding
    address: 0x0176
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente L3"
    id: acrel_apparent_power_l3
    register_type: holding
    address: 0x0178
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Puissance Apparente Totale"
    id: acrel_apparent_power_total
    register_type: holding
    address: 0x017A # Résolution 0.001kVA
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    unit_of_measurement: "kVA"
    device_class: apparent_power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance L1"
    id: acrel_power_factor_l1
    register_type: holding
    address: 0x017C # Résolution 0.001
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance L2"
    id: acrel_power_factor_l2
    register_type: holding
    address: 0x017D
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance L3"
    id: acrel_power_factor_l3
    register_type: holding
    address: 0x017E
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Facteur de Puissance Totale"
    id: acrel_power_factor_total
    register_type: holding
    address: 0x017F # Résolution 0.001
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    device_class: power_factor
    state_class: measurement

  # --- ENERGIE ACTIVE ACREL (Import/Export, compteur total) ---
  # Les 4 capteurs "internal" ci-dessous (spike/peak/flat/valley, tarifs horaires
  # non utilisés ici) bridgent le trou entre 0x000A et 0x0014 pour que les deux
  # compteurs import/export soient lus en 1 seule requête Modbus au lieu de 2.

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Active Importée"
    id: acrel_energy_import
    register_type: holding
    address: 0x000A # Current forward active total energy, résolution 0.01kWh
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Pointe (non utilisé)"
    id: acrel_energy_import_spike
    internal: true
    register_type: holding
    address: 0x000C
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Pleine (non utilisé)"
    id: acrel_energy_import_peak
    internal: true
    register_type: holding
    address: 0x000E
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Normale (non utilisé)"
    id: acrel_energy_import_flat
    internal: true
    register_type: holding
    address: 0x0010
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée Creuse (non utilisé)"
    id: acrel_energy_import_valley
    internal: true
    register_type: holding
    address: 0x0012
    value_type: U_DWORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Active Exportée"
    id: acrel_energy_export
    register_type: holding
    address: 0x0014 # Current reversing active total energy, résolution 0.01kWh
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  # --- ENERGIE PAR PHASE ACREL (L1/L2/L3, même bloc registre 0x0087-0x008B) ---
  # L2 = circuit dédié EVSE. L1/L3 ajoutés pour bridger le bloc en 1 seule requête
  # (gain marginal, mais donne aussi la donnée par phase gratuitement).

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée L1"
    id: acrel_energy_import_l1
    register_type: holding
    address: 0x0087 # Forward active energy of A phase
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée L2 (EV)"
    id: acrel_energy_import_l2
    register_type: holding
    address: 0x0089 # Forward active energy of B phase (même canal que Courant/Puissance L2)
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: acrel_adl400
    name: "Acrel Energie Importée L3"
    id: acrel_energy_import_l3
    register_type: holding
    address: 0x008B # Forward active energy of C phase
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  # --- ENERGIE LINKY ---

  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "EAST"
    name: "Linky Index Consommation"
    unit_of_measurement: "Wh"
    icon: mdi:gauge
    device_class: energy
    state_class: total_increasing

# --- TEXT SENSOR POUR LE LINKY (Déclenchement HC/HP) ---

text_sensor:
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "LTARF" # Optionnel : remonte le nom du tarif en cours ("HEURE CREUSE", "HEURE PLEINE"...)
    name: "Linky Tarif en cours"

  # STGE = registre de statuts du Linky (8 hex = 32 bits), tag numérique au sens
  # TIC mais pas une grandeur décimale -> passe par text_sensor (teleinfo.sensor
  # fait un parse_number<float> qui échouerait sur du hex). Décodé bit à bit
  # ci-dessous vers des binary_sensor à chaque nouvelle valeur (cf. Enedis-NOI-CPT_54E) :
  # bit 6 = surtension sur une des phases, bit 7 = dépassement de puissance de référence.
  - platform: teleinfo
    teleinfo_id: linky_tic
    tag_name: "STGE"
    name: "Linky Registre de Statuts (brut)"
    id: linky_stge
    icon: mdi:information-outline
    on_value:
      then:
        - lambda: |-
            uint32_t stge = strtoul(x.c_str(), nullptr, 16);
            id(linky_depassement_puissance).publish_state((stge & (1u << 7)) != 0);
            id(linky_surtension).publish_state((stge & (1u << 6)) != 0);
        # Log explicite (indépendant du binary_sensor) : BinarySensor n'émet pas
        # d'évènement d'état/API au tout premier publish_state() du boot (évite
        # de déclencher les automatisations sur l'état par défaut), donc sans ce
        # log la toute première valeur ne serait jamais visible dans "esphome logs".
        - logger.log:
            format: "Linky STGE=%s -> dépassement puissance=%d, surtension=%d"
            args:
              - x.c_str()
              - id(linky_depassement_puissance).state
              - id(linky_surtension).state

binary_sensor:
  - platform: template
    id: linky_depassement_puissance
    name: "Linky Dépassement Puissance Référence"
    device_class: problem

  - platform: template
    id: linky_surtension
    name: "Linky Surtension"
    device_class: problem

# =====================================================================
# 4. BOUCLE D'ENVOI API VERS LE SMARTEVSE (Toutes les 3s)
# =====================================================================

interval:
  - interval: 3s # comme le script Berry : moins fréquent = moins de blocages, largement sous le timeout 11s de SmartEVSE
    id: smartevse_feed
    then:
      - if:
          condition:
            lambda: |-
              return id(acrel_current_l1).has_state() &&
                     id(acrel_current_l2).has_state() &&
                     id(acrel_current_l3).has_state() &&
                     id(acrel_active_power_l2).has_state() &&
                     id(acrel_energy_import_l2).has_state() &&
                     id(smartevse_mqtt).is_connected();
          then:
            # --- CALCULS ---
            - lambda: |-
                float l1 = id(acrel_current_l1).state;
                float l2 = id(acrel_current_l2).state;
                float l3 = id(acrel_current_l3).state;

                // Maison globale = L1 + L2 + L3 (car tout est en mono)
                float mains_total = l1 + l2 + l3;

                id(smartevse_mains_da) = (int)(mains_total * 10.0);
                id(smartevse_ev_da) = (int)(l2 * 10.0);

                // Puissance/énergie EV : canal L2/Phase B = circuit dédié EVSE.
                // /ev_meter n'actualise import_active_power/energy que si les 3 paramètres
                // (import_active_power, import_active_energy, export_active_energy) sont
                // envoyés ensemble (cf. http_handlers.cpp du fork basmeerman) ; L1/L2/L3
                // seuls ne mettent à jour que les courants, pas la puissance/énergie affichée.
                id(smartevse_ev_power_w) = (int)(id(acrel_active_power_l2).state * 1000.0);
                id(smartevse_ev_energy_wh) = (int)(id(acrel_energy_import_l2).state * 1000.0);

            # --- ENVOI MAINS METER (Réseau global simulé sur L1) ---
            # Format payload = mqtt_parse_mains_meter() du fork basmeerman : "L1:L2:L3" en dA.
            - mqtt.publish:
                topic: "SmartEVSE/8931/Set/MainsMeter"
                payload: !lambda |-
                  return to_string(id(smartevse_mains_da)) + ":0:0";
                qos: 1

            - logger.log:
                format: "SmartEVSE MQTT MainsMeter published: L1=%d"
                args: [id(smartevse_mains_da)]

            # --- ENVOI EV METER (topic Set/EVMeter, cf. mqtt_parser.c du fork basmeerman) ---
            # Nécessite EVMeter = "API" dans la config SmartEVSE. Format payload = "L1:L2:L3:W:Wh"
            # en un seul message (contrairement au REST /ev_meter, pas besoin d'envoyer les 5
            # paramètres séparément ni de les grouper en 2 lots).
            - mqtt.publish:
                topic: "SmartEVSE/8931/Set/EVMeter"
                payload: !lambda |-
                  return to_string(id(smartevse_ev_da)) + ":0:0:" +
                         to_string(id(smartevse_ev_power_w)) + ":" +
                         to_string(id(smartevse_ev_energy_wh));
                qos: 1

            - logger.log:
                format: "SmartEVSE MQTT EVMeter published: L1=%d P=%dW E=%dWh"
                args: [id(smartevse_ev_da), id(smartevse_ev_power_w), id(smartevse_ev_energy_wh)]

logger:
  level: DEBUG

